# Maliki rulebook bootstrap focusing on eligibility and foundational fixed shares.
# Expressions rely on the Predicate DSL (presence/count/ctx.*) evaluated by RuleBookMaliki.

context_flags:
  mother_reduced: "ctx.has_descendants || ctx.siblings_count_preblock >= 2"
  mother_third_of_remainder: "(presence('husband') || presence('wife')) && presence('father') && presence('mother') && !ctx.has_descendants"

blocks:
  - id: "block_pgf_by_father"
    when: "presence('father')"
    targets:
      - paternal_grandfather
    reason: "father outranks paternal grandfather"

  - id: block_siblings_by_pgf
    when: "presence('paternal_grandfather') && !presence('father')"
    targets:
      - full_brother
      - full_sister
      - consanguine_brother
      - consanguine_sister
    reason: "paternal grandfather outranks siblings when father is absent"

  - id: block_all_grandmothers_by_mother
    when: "presence('mother')"
    targets:
      - maternal_grandmother
      - paternal_grandmother
    reason: "mother outranks all grandmothers"

  - id: block_remote_by_nearer_maternal
    when: "presence('maternal_grandmother')"
    targets:
      - maternal_great_grandmother
    reason: "nearer maternal grandmother blocks remote"

  - id: block_remote_by_nearer_paternal
    when: "presence('paternal_grandmother')"
    targets:
      - paternal_great_grandmother
    reason: "nearer paternal grandmother blocks remote"

  # Sons or paternal ascendants remove full and consanguine siblings.
  - id: maliki.block.sons_or_ascendants_block_siblings
    reason: Male descendants or paternal ascendants exclude full and consanguine siblings.
    when: "presence('son') || presence('father') || presence('paternal_grandfather')"
    targets:
      - full_brother
      - full_sister
      - consanguine_brother
      - consanguine_sister

  - id: "block_brothers_by_sons_son"
    when: "presence('sons_son')"
    targets:
      - full_brother
      - full_sister
      - consanguine_brother
      - consanguine_sister
    reason: "agnatic grandson blocks siblings"

  - id: block_consanguine_sisters_by_full_sisters
    when: "count('full_sister') >= 1"
    targets:
      - consanguine_sister
    reason: "full sister outranks consanguine sister"

  - id: block_uterines_by_desc_or_asc_male
    when: "ctx.has_descendants || presence('father') || presence('paternal_grandfather')"
    targets:
      - uterine_brother
      - uterine_sister
    reason: "uterines blocked by descendants or male ascendants"

fixed_shares:
  husband:
    - when: "!ctx.has_descendants"
      share: "1/2"
    - when: ctx.has_descendants
      share: "1/4"

  wife:
    - when: "!ctx.has_descendants"
      share: "1/4"
    - when: ctx.has_descendants
      share: "1/8"

  mother:
    - when: "ctx.has_descendants || ctx.siblings_count >= 2"
      share: "1/6"
    - when: otherwise
      share: "1/3"

  father:
    - when: ctx.has_descendants
      share: "1/6"

  daughter:
    - when: "count('daughter') == 1 && !presence('son')"
      share: "1/2"
    - when: "count('daughter') >= 2 && !presence('son')"
      group_share: "2/3"
      distribute: equal

  uterine_brother:
    - when: "ctx.uterines_count == 1"
      share: "1/6"
    - when: "ctx.uterines_count >= 2"
      group_share: "1/3"
      distribute: equal

  uterine_sister:
    - when: "ctx.uterines_count == 1"
      share: "1/6"
    - when: "ctx.uterines_count >= 2"
      group_share: "1/3"
      distribute: equal

mother_reduction:
  - "ctx.has_descendants || ctx.siblings_count >= 2"

special_cases:
  actions:
    - id: maliki.action.umariyya_husband
      when: "presence('husband') && presence('mother') && presence('father') && !ctx.has_descendants"
      action: mark_umariyya
      reason: Husband, mother, and father trigger the 'Umariyya adjustment.

    - id: maliki.action.umariyya_wife
      when: "presence('wife') && presence('mother') && presence('father') && !ctx.has_descendants"
      action: mark_umariyya
      reason: Wife, mother, and father trigger the 'Umariyya adjustment.

  flags:
    - id: maliki.flag.mother_third_remainder
      reason: Mother takes one third of the remainder with spouse and father, no descendants.
      when: "!ctx.has_descendants && presence('mother') && presence('father') && (presence('husband') || presence('wife'))"
      targets:
        - mother
    - id: maliki.flag.daughter_granddaughter_two_thirds
      reason: Granddaughters through sons complete two-thirds with a single daughter.
      when: "count('daughter') == 1 && !presence('son') && count('sons_daughter') > 0 && !presence('sons_son')"
      targets:
        - daughter
        - sons_daughter
    - id: maliki.flag.consanguine_asaba_with_daughter
      reason: Consanguine sisters may share residual with daughters when full sisters are absent.
      when: otherwise
      targets:
        - consanguine_sister

  radd:
    exclusions:
      - husband
      - wife

special_flags:
  consanguine_asaba_with_daughter: true
  grandmothers_mode: "single_closest"
  grandmothers_preference: "maternal_first"
  substitution_policy: "none"
