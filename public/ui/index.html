<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Islamic Inheritance - MVP</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="headerRow">
          <div>
            <h1 id="appTitle">Islamic Inheritance</h1>
            <p id="appSubtitle" class="subtitle">MVP UI: deceased-centric by counts</p>
          </div>
          <div class="row">
            <div class="row langBox">
              <label id="langLabel" for="langSelect">Language</label>
              <select id="langSelect" aria-label="Language">
                <option value="en">English</option>
                <option value="es">Español</option>
              </select>
            </div>
            <a id="selftestLink" href="./selftest/">Selftest</a>
          </div>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="grid">
        <section class="card">
          <h2 id="inputTitle">Input</h2>
          <div id="mountForm"></div>
          <div class="rowEnd">
            <button id="btnReset" type="button" class="secondary">Reset</button>
            <button id="btnCalc" type="button">Calculate</button>
          </div>
          <div id="bannerArea"></div>
          <small id="inputHint" class="hint">The UI validates basics; the calculator applies blocks and normalizations.</small>
        </section>

        <section class="card">
          <h2 id="resultTitle">Results</h2>
          <div id="mountResult"></div>
        </section>
      </section>

      <details id="debugPanel">
        <summary id="debugSummary">Debug</summary>
        <div id="mountDebug"></div>
      </details>
    </main>

    <footer class="footer">
      <div class="container">
        <small id="footerText">MVP UI</small>
      </div>
    </footer>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
